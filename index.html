<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUP TIME — Бронирование</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ЭКРАН 1: Приветствие -->
    <div id="greetingScreen" class="screen">
      <header>
        <h1>🏄 SUP TIME</h1>
        <p>Забронируй сап-прогулку</p>
      </header>
      <div style="text-align: center; margin-top: 20px;">
        <p id="greetingMessage" style="font-size:18px; margin-bottom:20px;">👋 Привет!</p>
        <button id="chooseTourBtn" class="main-btn">Выбрать свою прогулку</button>
        <button id="myBookingsBtn" class="main-btn" style="margin-top:12px; background: var(--tg-theme-secondary-bg-color, #6c757d);">📋 Мои бронирования</button>
<!-- Кнопка "Админ" - скрыта по умолчанию, будет показана только для администратора -->
<button id="adminLoginBtn" class="main-btn hidden" style="margin-top:12px; background: var(--tg-theme-secondary-bg-color, #6c757d);">🔐 Админ</button>
      </div>
    </div>

    <!-- ЭКРАН 2: Календарь -->
    <div id="calendarScreen" class="screen" style="display:none;">
      <h2 style="text-align:center; margin-bottom:8px;">🗓 Выберите дату</h2>
      <div class="calendar-nav">
        <button id="prevMonth">◀</button>
        <span id="monthYear"></span>
        <button id="nextMonth">▶</button>
      </div>
      <div id="calendarContainer">
        <div id="daysGrid" class="days-grid"></div>
      </div>
      <button onclick="showScreen('greetingScreen')" class="back-btn" style="margin-top:12px;">← Назад</button>
    </div>

    <!-- ЭКРАН 3: Список туров на выбранную дату -->
    <div id="toursScreen" class="screen" style="display:none;">
      <h2 style="text-align:center; margin-bottom:8px;">📋 Доступные прогулки</h2>
      <div id="toursList"></div>
      <button onclick="showScreen('calendarScreen')" class="back-btn" style="margin-top:12px;">← Назад</button>
    </div>

    <!-- ЭКРАН 4: Форма бронирования -->
    <div id="bookingForm" class="screen" style="display:none;">
      <h2 style="text-align:center; margin-bottom:8px;">✏️ Заполните данные</h2>
      <div id="tourInfo" style="margin-bottom:12px; font-weight:500; text-align:center;"></div>
      <form id="bookingFormInner">
        <input type="hidden" id="tourId" value="">
        <input type="hidden" id="maxSpots" value="">
        <input type="hidden" id="pricePerBoard" value="">

        <div class="field">
          <label for="name">Ваше имя *</label>
          <input type="text" id="name" placeholder="Иван" required>
        </div>

        <div class="field">
          <label for="phone">Телефон *</label>
          <input type="tel" id="phone" placeholder="+7 900 123-45-67" required>
        </div>

        <div class="field">
          <label for="boards">Количество сапов *</label>
          <input type="number" id="boards" min="1" max="14" value="1" required>
        </div>

        <div class="field">
          <label for="comment">Комментарий (не обязательно)</label>
          <textarea id="comment" rows="2" placeholder="Пожелания..."></textarea>
        </div>

        <div id="statusMessage" style="margin:12px 0; text-align:center;"></div>
        <button type="submit" id="submitBtn">Забронировать</button>
        <button type="button" onclick="showScreen('toursScreen')" class="back-btn" style="margin-top:12px;">← Назад</button>
      </form>
    </div>

    <!-- ЭКРАН 5: Мои бронирования -->
    <div id="myBookingsScreen" class="screen" style="display:none;">
      <h2 style="text-align:center; margin-bottom:8px;">📋 Мои бронирования</h2>
      <div style="margin-bottom:12px;">
        <input type="tel" id="myPhoneInput" placeholder="Введите ваш телефон" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;">
        <button id="loadMyBookingsBtn" class="main-btn" style="margin-top:8px; padding:10px; font-size:16px;">Показать</button>
      </div>
      <div id="myBookingsList"></div>
      <button onclick="showScreen('greetingScreen')" class="back-btn" style="margin-top:12px;">← На главную</button>
    </div>

    <!-- ЭКРАН 6: Админ-панель -->
    <div id="adminScreen" class="screen" style="display:none;">
      <h2 style="text-align:center; margin-bottom:8px;">🔧 Управление прогулками</h2>
      <button onclick="showScreen('greetingScreen')" class="back-btn" style="margin-bottom:16px;">← На главную</button>

      <div style="background: var(--tg-theme-bg-color); padding:16px; border-radius:14px; margin-bottom:16px;">
        <h3 style="margin-bottom:8px;">➕ Добавить прогулку</h3>
        <div class="field">
          <label>Дата *</label>
          <input type="date" id="adminDate" required>
        </div>
        <div class="field">
          <label>Время *</label>
          <input type="time" id="adminTime" required>
        </div>
        <div class="field">
          <label>Маршрут *</label>
          <input type="text" id="adminRoute" placeholder="Например: мкр.Московский - пляж Брянск 1й">
        </div>
        <div class="field">
          <label>Макс. мест *</label>
          <input type="number" id="adminMaxSpots" min="1" max="20" value="14">
        </div>
        <div class="field">
          <label>Цена за сап (руб.) *</label>
          <input type="number" id="adminPrice" min="0" value="1700">
        </div>
        <div class="field">
          <label>Описание маршрута (для клиента после бронирования)</label>
          <textarea id="adminDescription" rows="3" placeholder="Подробное описание маршрута..."></textarea>
        </div>
        <div class="field">
          <label>Ссылка на карту (Яндекс)</label>
          <input type="url" id="adminMapUrl" placeholder="https://yandex.ru/maps/...">
        </div>
        <button id="addTourBtn" class="main-btn" style="padding:12px; font-size:16px;">➕ Добавить прогулку</button>
      </div>

      <div>
        <h3 style="margin-bottom:8px;">📋 Существующие прогулки</h3>
        <div id="adminToursList"></div>
      </div>
    </div>

  </div>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
